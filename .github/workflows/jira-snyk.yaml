name: Snyk to JIRA bugs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # A cron job which runs at 5 AM on every Monday.
permissions:
  contents: read
env:
  # secrets
  JIRA_API_TOKEN: ${{ secrets.jira_api_token }}
  JIRA_EMAIL: ${{ secrets.jira_email }}
  SNYK_API_TOKEN: ${{ secrets.snyk_api_token }}
  # JIRA envs
  JIRA_SERVER: https://redhat.atlassian.net # Jira Cloud server
  JIRA_PROJECT_ID: 12340620 # refers to RHOAIENG
  JIRA_PROJECT_KEY: RHOAIENG
  JIRA_LABEL_PREFIX: "snyk-jira-integration:"
  # SNYK envs
  SNYK_ORG_ID: ed870ef2-8f76-4ea1-ad4b-dacfa225eb69 # refers to the RHOAI org in Snyk
  # config file paths
  COMPONENT_MAPPING_FILE_PATH: ./config/jira_components_mapping.json
  EXCLUDE_FILES_FILE_PATH: ./config/exclude_files.json
  # other envs
  DRY_RUN: false

jobs:
  jira-snyk-reporter-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: execute py script for automation
        run: python -m snyk_jira_reporter --disable-dep-analysis

      - name: Show component report in run summary
        run: cat UNMAPPED_REPOSITORIES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload component report
        uses: actions/upload-artifact@v4
        with:
          name: component-mapping-report
          path: UNMAPPED_REPOSITORIES.md
          if-no-files-found: error
